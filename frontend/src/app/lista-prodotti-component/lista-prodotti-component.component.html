<h2>Catalogo Prodotti</h2>

@if (loading) {
  <div style="font-style: italic; color: gray;">
    Caricamento prodotti in corso...
  </div>
} @else {
  <ul>
    @for (p of prodotti; track p.id) {
      <li>
        <strong>{{ p.nome }}</strong> - Prezzo Netto: €{{ p.prezzo }} | 
        <strong>Prezzo Ivato: €{{ p.prezzo_ivato }}</strong>
      </li>
    } @empty {
      <li>Nessun prodotto presente a catalogo.</li>
    }
  </ul>
}
